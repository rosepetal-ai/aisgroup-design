<title>Firma de correo, Rosepetal</title>
<!--
  Firma de correo, Rosepetal. Kit de marketing v0.2.
  Nombre, cargo, marca, teléfono y web; ninguna imagen salvo el logotipo; ningún eslogan (Comunicaciones, Firma de correo).
  Bloque horizontal: logotipo a 130 px de ancho (firma, no encabezado), una línea vertical de 1 px y el texto en Arial 14 px
  sobre 21 px, notas 12 px. En pantallas estrechas el texto pasa debajo del logotipo.
  Modo oscuro: la firma lleva los dos logotipos, el azul visible y el blanco oculto, sin placa blanca detrás.
  @media (prefers-color-scheme: dark) (Apple Mail, Outlook para Mac e iOS) y [data-ogsc] (Outlook.com) los intercambian.
  Gmail ignora la media query y mantiene la versión clara, con el logotipo azul. Los editores de firma que pegan solo
  estilos en línea pierden el bloque <style>: en ellos se ve siempre el logotipo azul.
  Cómo instalarla:
  1. Sube img/rosepetal-blue.png e img/rosepetal-white.png a un servidor y cambia cada src="img/..." por su URL absoluta.
  2. La firma lleva datos de ejemplo. Cambia cada campo marcado con el comentario «editar»: nombre, cargo y teléfono
     (el teléfono también en href="tel:...", sin espacios). Los comentarios no se ven y pueden quedarse.
  3. Abre este archivo en el navegador, selecciona la firma, cópiala y pégala en la configuración de firma del cliente de correo.
-->
<style>
  /* Narrow screens: the text drops under the logo and the rule goes. */
  @media screen and (max-width: 480px) {
    .sig-logo { display: block !important; padding-bottom: 4px !important; }
    .sig-logo-cell { padding-right: 0 !important; }
    .sig-rule { border-left: 0 !important; padding-left: 0 !important; }
  }
  /* Dark mode: the white logo replaces the blue one. Gmail ignores this and keeps the light version. */
  @media (prefers-color-scheme: dark) {
    .sig-logo-light { display: none !important; }
    .sig-logo-dark { display: block !important; max-height: none !important; overflow: visible !important; }
  }
  [data-ogsc] .sig-logo-light { display: none !important; }
  [data-ogsc] .sig-logo-dark { display: block !important; max-height: none !important; overflow: visible !important; }
</style>
</head>
