<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIS studio stage</title>
<style>
  /* AIS Group content stage. render.mjs loads this page, calls setup(spec) once and frame(n) for every frame.
     Grown from the video kit's scenes.html: the same motion tokens and brand devices, plus the layouts for
     social posts and LinkedIn carousels. A post is the same scene, held on its settled frame. */
  @font-face { font-family: Inter; src: url(../brand/fonts/inter-latin.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Inter; src: url(../brand/fonts/inter-latin-ext.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'JetBrains Mono'; src: url(../brand/fonts/jetbrains-mono-latin.woff2) format('woff2'); font-weight: 100 800; }
  @font-face { font-family: 'JetBrains Mono'; src: url(../brand/fonts/jetbrains-mono-latin-ext.woff2) format('woff2'); font-weight: 100 800; unicode-range: U+0100-02AF, U+1E00-1EFF; }
  :root { --blue-200: #A7BFE4; --blue-300: #7C9FD7; --blue-500: #3664B3; --blue-700: #17356E; --blue-950: #0B1220; --ink: #0F1729;
    --n100: #F1F5F9; --n200: #E2E8F0; --n400: #94A3B8; --n500: #64748B; --n600: #4B5563; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: Inter, sans-serif; font-feature-settings: 'ss01' 0; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; overflow: hidden; }
  .fill { position: absolute; inset: 0; }
  .center { position: absolute; inset: 0; display: grid; place-items: center; }
  .card { display: flex; flex-direction: column; align-items: center; }
  .card img { display: block; height: auto; }
  .url { color: var(--ink); font-weight: 500; font-size: 40px; line-height: 1; letter-spacing: -0.005em; }
  .endorse { position: absolute; left: 0; right: 0; text-align: center; color: var(--n600); font-weight: 400; font-size: 32px; line-height: 1; }
  .plate { position: absolute; display: flex; flex-direction: column; gap: 8px; padding: 24px 32px; background: var(--ink); color: #fff; }
  .plate b { font-weight: 600; font-size: 44px; line-height: 1.15; letter-spacing: -0.01em; }
  .plate span { color: var(--n400); font-size: 32px; line-height: 1.2; }
  /* Headlines are weight 500, sentence case, at most three lines (Typography). */
  .title { position: absolute; display: flex; flex-direction: column; font-weight: 500; font-size: 96px; line-height: 1.08; letter-spacing: -0.02em; }
  .title .line { display: block; overflow: hidden; padding-bottom: 0.08em; }
  .title .line > span { display: block; position: relative; }
  .layer { position: absolute; inset: 0; overflow: hidden; }
  .media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stand { position: absolute; display: flex; flex-direction: column; justify-content: center; color: #fff; }
  .stand .lead { color: #A7BFE4; font-weight: 500; font-size: 40px; line-height: 1.2; margin-bottom: 16px; }
  .stand .event { font-weight: 500; line-height: 1.02; letter-spacing: -0.025em; white-space: nowrap; }
  .stand .rows { display: flex; flex-direction: column; gap: 28px; margin-top: 64px; }
  .stand .row { display: flex; align-items: center; gap: 24px; font-weight: 500; font-size: 44px; line-height: 1.15; }
  .stand .row svg { flex: none; width: 48px; height: 48px; color: #A7BFE4; stroke-width: 1.75; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 32px; letter-spacing: 0.02em; line-height: 1.2; }
  .slot { position: absolute; inset: 0; background: #0B1220; }
  .slot .grid { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, #111A2E 0 2px, transparent 2px var(--col)); }
  .slot-label { position: absolute; color: #CBD5E1; }
  .slot-label .mono { font-size: clamp(26px, 2.7vw, 52px); }
  .inspect { position: absolute; inset: 0; }
  .corner { position: absolute; border: 0 solid; box-sizing: border-box; }
  .corner.lt { border-width: 4px 0 0 4px; transform-origin: 0 0; margin: -2px 0 0 -2px; }
  .corner.rt { border-width: 4px 4px 0 0; margin: -2px 0 0; translate: -100% 0; }
  .corner.lb { border-width: 0 0 4px 4px; translate: 0 -100%; margin: 0 0 0 -2px; }
  .corner.rb { border-width: 0 4px 4px 0; translate: -100% -100%; }
  .tag { position: absolute; display: flex; align-items: center; gap: 16px; padding: 12px 18px 12px 22px; background: var(--ink); color: #fff; border-left: 6px solid #A7BFE4;
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 34px; line-height: 1; white-space: nowrap; }
  .tag.defect { border-left-color: #F87171; }
  .tag .v { color: #94A3B8; }
  .verdict { position: absolute; display: flex; align-items: center; gap: 16px; padding: 18px 28px 18px 22px; color: #fff; font-size: 40px; line-height: 1; white-space: nowrap; }
  .verdict svg { width: 44px; height: 44px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .verdict b { font-weight: 600; } .verdict span { font-weight: 500; }
  .verdict.stack { align-items: flex-start; } .verdict.stack .t { display: flex; flex-direction: column; gap: 10px; } .verdict.stack span { font-size: 32px; }
  /* On posts and carousels the frame follows the guide's overlay kit (Imagery, Detection overlays), at 2× for a 1080 canvas:
     a hairline box with corner ticks in the detection blue, chips of ink at 90% with a 3 px state bar, Inter Medium labels,
     JetBrains Mono values, one compact verdict. */
  .post .inspect .hair { position: absolute; border: 2px solid; box-sizing: border-box; }
  .post .tag { font-family: 'Inter', sans-serif; font-size: 26px; padding: 10px 16px; gap: 12px; background: rgba(15,23,41,.9); border-left-width: 6px; }
  .post .tag .v { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .post .verdict { font-size: 26px; padding: 11px 16px 11px 12px; gap: 10px; }
  .post .verdict svg { width: 28px; height: 28px; stroke-width: 2.5; }
  .post .verdict.stack span, .post .verdict span { font-size: 26px; }
  .wipe { position: absolute; inset: 0; transform: translateY(100%); z-index: 5; background: #17356E; }
  .stat { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .stat .big { font-weight: 500; line-height: 0.95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 0.08em; }
  .stat .unit { font-size: 0.55em; letter-spacing: -0.02em; }
  .stat .ctx { font-weight: 500; font-size: 48px; line-height: 1.2; max-width: 18ch; }
  .stat .note { font-size: 28px; line-height: 1.4; max-width: 34ch; }
  .rule { display: block; transform: scaleX(0); }
  .scrim { position: absolute; left: 0; right: 0; pointer-events: none; }
  .scrim.top { top: 0; background: linear-gradient(to bottom, rgba(11,18,32,.92) 0%, rgba(11,18,32,.78) 55%, rgba(11,18,32,0) 100%); }
  .scrim.bottom { bottom: 0; background: linear-gradient(to top, rgba(11,18,32,.92) 0%, rgba(11,18,32,.78) 50%, rgba(11,18,32,0) 100%); }
  .overline { position: relative; display: block; margin-bottom: 40px; font-size: 32px; font-weight: 500; letter-spacing: 0.06em; color: #A7BFE4; }
  .standin { position: absolute; max-width: 70%; padding: 8px 12px; background: #0B1220; color: #94A3B8; font-size: 24px; line-height: 1.3; z-index: 2; }
  .scan { position: absolute; overflow: hidden; opacity: 0; --p: 0; }
  .scan.light::after { background: #3664B3; box-shadow: none; }
  .scan::after { content: ''; position: absolute; left: 0; right: 0; top: calc(var(--p) * 100%); height: 2px; background: #A7BFE4;
    box-shadow: 0 -24px 32px -8px rgba(167,191,228,.25); }
  .counter { position: absolute; color: #A7BFE4; }
  .stand .row { position: relative; }
  /* Blue is light, not paint: night with two soft brand-blue light sources that drift slowly. */
  .field { position: absolute; inset: 0; --lx: 22%; --ly: 18%; --mx: 88%; --my: 92%;
    background: radial-gradient(55% 65% at var(--lx) var(--ly), rgba(54,100,179,.55), rgba(54,100,179,0) 70%),
                radial-gradient(60% 70% at var(--mx) var(--my), rgba(23,53,110,.95), rgba(23,53,110,0) 70%), #0B1220; }
  /* Photographs and footage at their true grade: no filters, vignettes or grain (Imagery, Treatment). */
  .media { filter: none; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, rgba(11,18,32,0) 55%, rgba(11,18,32,.55) 100%); }
  .dim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,18,32,.72), rgba(11,18,32,.82)); }
  .grain { position: absolute; inset: 0; z-index: 9; pointer-events: none; opacity: .09; mix-blend-mode: overlay; }
  /* Detections: what the system sees, drawn the way it draws it. */
  .det { position: absolute; border: 4px solid #7C9FD7; background: rgba(124,159,215,.1); box-shadow: 0 0 0 1px rgba(11,18,32,.5); }
  .det b { position: absolute; left: -3px; bottom: 100%; display: flex; gap: 12px; padding: 8px 14px; background: #7C9FD7; color: #0B1220;
    font: 600 32px/1 'JetBrains Mono', ui-monospace, monospace; white-space: nowrap; }
  .det b span { font-weight: 500; }
  .captions { z-index: 6; position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .captions span { padding: 6px 16px; background: var(--ink); color: #fff; font-weight: 500; font-size: 40px; line-height: 1.2; }
  /* Tutorial steps (Video, Tutorials): Inter Medium 28 px on an ink plate fitted to the text, 24 px each side and 16 px above
     and below, a 1 px border and the overlay shadow at twice its strength. The drawn pointer and the press ripple go above. */
  .step { z-index: 6; position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
  .step span { padding: 16px 24px; background: var(--ink); border: 1px solid #1E293B; color: #fff; font-weight: 500; font-size: 28px; line-height: 36px; white-space: nowrap;
    box-shadow: 0 4px 12px rgb(15 23 41 / 12%), 0 24px 48px rgb(15 23 41 / 24%); }
  .pointer { z-index: 8; position: absolute; left: 0; top: 0; width: 25.1px; height: 39px; filter: drop-shadow(0 2px 3px rgb(15 23 41 / 35%)); }
  .ripple { z-index: 7; position: absolute; left: 0; top: 0; width: 69px; height: 69px; margin: -34.5px 0 0 -34.5px; border: 2px solid #3664B3; background: rgb(54 100 179 / 25%); border-radius: 50%; opacity: 0; }

  /* Posts and carousel slides: a 1080 px wide canvas seen at about half size in the feed, so the web type
     scale doubles and nothing people read goes under 26 px. Square corners everywhere (Layout and shape). */
  .post { --display: 120px; --heading: 84px; --lead: 44px; --body: 36px; --small: 30px; }
  .block { position: absolute; display: flex; flex-direction: column; }
  .block .title { position: relative; }
  .block .h { font-size: var(--heading); line-height: 1.06; letter-spacing: -0.035em; }
  .block .d { font-size: var(--display); line-height: 1.02; letter-spacing: -0.04em; }
  .block .overline { margin-bottom: 32px; font-size: var(--small); }
  .block p { position: relative; font-size: var(--body); line-height: 1.45; max-width: 38ch; margin-top: 40px; }
  .block p.lead { font-size: var(--lead); line-height: 1.35; letter-spacing: -0.01em; max-width: 30ch; }
  .light { color: var(--ink); } .light .overline { color: var(--blue-500); } .light p { color: var(--n600); }
  .dark { color: #fff; } .dark .overline { color: #A7BFE4; } .dark p { color: var(--n100); }
  .list { position: relative; display: flex; flex-direction: column; margin-top: 56px; }
  /* Inner slides: the headline holds the top, the paragraph or the list holds the foot. */
  .block.spread > p { margin-top: auto; padding-top: 56px; }
  /* A list fills the slide under its headline: the rows share the height, each opened by its rule, like a spec sheet. */
  .block.spread > .list { flex: 1; margin-top: 72px; } .block.spread > .list .item { flex: 1; align-content: center; max-height: 240px; }
  .block.spread > p { font-size: var(--lead); line-height: 1.35; letter-spacing: -0.01em; max-width: 30ch; }
  /* Social list details start at a consistent inset instead of floating in stretched rows. */
  .post .block.spread > .list .item { align-content: start; }
  .list .item { position: relative; display: grid; grid-template-columns: 56px 1fr; column-gap: 32px; padding: 32px 0; }
  .list .item svg { width: 56px; height: 56px; margin-top: -2px; stroke-width: 1.75; }
  .light .list .item svg { color: var(--blue-500); } .dark .list .item svg { color: #A7BFE4; }
  .list .item b { font-weight: 500; font-size: var(--lead); line-height: 1.25; letter-spacing: -0.01em; }
  .list .item span { grid-column: 2; font-size: var(--small); line-height: 1.4; margin-top: 8px; }
  .light .list .item span { color: var(--n600); } .dark .list .item span { color: var(--n400); }
  .photo { position: absolute; overflow: hidden; background: #0B1220; }
  .chip { position: absolute; display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--ink); color: #fff; font-size: var(--small); line-height: 1; font-weight: 500; z-index: 3; }
  .chip svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chip.pass svg { color: #4ADE80; } .chip.reject svg { color: #F87171; }
  .note-cap { position: absolute; font-size: var(--small); line-height: 1.3; z-index: 4; }
  .quote-mark { font-size: var(--display); line-height: 1; color: var(--blue-500); margin-bottom: 8px; }
  .who { position: relative; display: flex; align-items: center; gap: 32px; margin-top: 56px; }
  .who img { width: 160px; height: 160px; object-fit: cover; display: block; }
  .who b { display: block; font-weight: 600; font-size: var(--body); line-height: 1.25; }
  .who span { display: block; font-size: var(--small); line-height: 1.35; margin-top: 4px; }
  .light .who span { color: var(--n600); } .dark .who span { color: var(--n400); }
  .action { position: relative; align-self: flex-start; display: flex; align-items: center; gap: 24px; margin-top: 72px; padding: 42px 48px; background: #fff; color: var(--blue-700);
    font-weight: 500; font-size: var(--lead); line-height: 1; }
  .action svg { width: 40px; height: 40px; stroke-width: 2; flex: none; margin: 0 calc(-40px * 5 / 24); } /* the arrow's own side space (5 of 24 units) cancelled: equal padding, the gap measured to the stroke */
  .action > span { text-box: trim-both cap alphabetic; } /* the words trimmed to their capitals, so the arrow and the box centre on them */
  .dest { position: relative; margin-top: 24px; color: #A7BFE4; }
  .sign { position: absolute; display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
  .sign span { font-size: var(--small); line-height: 1; color: #A7BFE4; }
  .chrome-logo { position: absolute; display: block; z-index: 4; }
  .chrome-count { position: absolute; z-index: 4; font-size: var(--small); }
  /* The AIS layouts. */
  .hexes { position: absolute; inset: 0; pointer-events: none; }
  .hexi { position: relative; flex: none; display: grid; place-items: center; }
  .hexi > svg.hx { position: absolute; inset: 0; width: 100%; height: 100%; fill: rgba(23,53,110,.55); stroke: #7C9FD7; stroke-width: 2.5; }
  .hexi > svg:not(.hx) { position: relative; width: 44%; height: 44%; color: #fff; stroke-width: 1.75; }
  .hexi.light > svg.hx { fill: #fff; stroke: #3664B3; } .hexi.light > svg:not(.hx) { color: var(--blue-700); }
  .hexi.num > svg.hx { fill: none; stroke: #3664B3; stroke-width: 3; } .hexi.num b { position: relative; color: var(--blue-700); font-weight: 500; font-size: 28px; font-variant-numeric: tabular-nums; }
  .hexi.num.on-dark > svg.hx { stroke: #A7BFE4; } .hexi.num.on-dark b { color: #fff; }
  .scrim.navy { bottom: 0; background: linear-gradient(to top, #0B1220 0%, #0B1220 55%, rgba(11,18,32,0) 100%); }
  .acc { font-style: normal; color: #7C9FD7; } .light .acc { color: var(--blue-500); }
  .block.hero .title.d { font-size: 112px; letter-spacing: -0.04em; }
  .block .bar { display: block; width: 120px; height: 6px; background: #3664B3; margin-top: 36px; }
  .block.hero p { margin-top: 32px; }
  .feats { position: relative; display: flex; gap: 40px; margin-top: 48px; }
  .feats > div { display: flex; align-items: center; gap: 16px; max-width: 280px; } .feats > div > span { font-size: var(--small); line-height: 1.25; color: var(--n100); }
  .panel { position: absolute; z-index: 2; display: flex; flex-direction: column; padding: 48px 48px 40px; background: rgba(11,18,32,.94); border: 1px solid rgba(124,159,215,.35); color: #fff; }
  .panel .overline { margin-bottom: 28px; font-size: var(--small); color: #A7BFE4; }
  .panel .title, .panel .overline, .panel p { position: relative; }
  .photo.framed.on-light { outline: 1px solid var(--n200); }
  .caption.below { position: absolute; z-index: 3; padding: 0; background: none; color: var(--n600); font-size: 26px; line-height: 1.3; letter-spacing: 0.02em; }
  .light .irow > div > span, .light .cell > span:not(.hexi) { color: var(--n600); }
  .light .irow + .irow { box-shadow: inset 0 1px 0 var(--n200); }
  .light .irow { padding: 14px 0; gap: 24px; } .light .irow > div > b { font-size: 34px; } .light .irows { margin-top: 28px; }
  .photo.framed { outline: 1px solid rgba(124,159,215,.4); } .photo.framed .caption { padding-left: 20px; }
  .photo .caption.above-panel { left: auto; right: 80px; bottom: 120px; padding: 10px 18px; }
  .panel.fill-down > p:last-child { margin-top: auto; padding-top: 32px; } .panel.fill-down > .irows { flex: 1; justify-content: space-evenly; }
  .panel .title.h { font-size: 72px; line-height: 1.06; letter-spacing: -0.03em; }
  .panel p { margin-top: 28px; font-size: var(--body); line-height: 1.4; color: var(--n100); max-width: 34ch; }
  .irows { position: relative; display: flex; flex-direction: column; margin-top: 36px; }
  .irow { position: relative; display: flex; align-items: center; gap: 28px; padding: 20px 0; }
  .irow > div > b { display: block; font-weight: 500; font-size: 38px; line-height: 1.2; letter-spacing: -0.01em; } .irow > div > span { display: block; margin-top: 6px; font-size: var(--small); line-height: 1.35; color: var(--n400); }
  .irows.ev { margin-top: 56px; } .irows.ev .irow b { font-size: 40px; }
  .cells { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 48px 48px; margin-top: 64px; }
  .cell { display: flex; flex-direction: column; gap: 20px; } .cell b { font-weight: 500; font-size: 40px; line-height: 1.15; letter-spacing: -0.01em; } .cell > span:not(.hexi) { font-size: var(--small); line-height: 1.4; color: var(--n400); margin-top: -8px; }
  .cells.compact { gap: 40px 40px; margin-top: 56px; } .cells.compact .cell { grid-template-rows: auto 1fr; } .cells.compact .cell { display: grid; grid-template-columns: 72px 1fr; column-gap: 24px; row-gap: 6px; align-items: start; }
  /* A cell with a picture shows the thing itself: the real image, its name underneath, a hairline frame on what it names. */
  .cells.pics { gap: 40px 32px; } .cell.pic { gap: 14px; } .cell.pic .tile { position: relative; overflow: hidden; aspect-ratio: 4 / 3; outline: 1px solid rgba(124,159,215,.4); }
  .light .cell.pic .tile { outline-color: var(--n200); } .cell.pic .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cell.pic .tile i { position: absolute; border: 3px solid #A7BFE4; } .light .cell.pic .tile i { border-color: var(--blue-700); }
  .cell.pic b { font-size: 34px; }
  .cells.compact .hexi { width: 72px !important; height: 72px !important; grid-row: span 2; } .cells.compact .cell b { font-size: 34px; } .cells.compact .cell > span:not(.hexi) { margin-top: 0; }
  .callouts { position: absolute; inset: 0; }
  .co-chip { position: absolute; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 10px 22px 10px 10px; background: rgba(15,23,41,.92); border: 1px solid rgba(124,159,215,.45); color: #fff; font-weight: 500; font-size: 28px; line-height: 1.15; max-width: 400px; }
  .co-line { position: absolute; height: 2px; background: #7C9FD7; transform-origin: 0 50%; z-index: 1; }
  .co-dot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 3px solid #7C9FD7; background: rgba(11,18,32,.6); border-radius: 50%; z-index: 1; }
  .boxes { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 64px; }
  .box { display: flex; flex-direction: column; gap: 10px; padding: 22px 24px; border: 1px solid rgba(167,191,228,.4); } .box:last-child:nth-child(odd) { grid-column: span 2; }
  .box .mono { font-size: 26px; color: #A7BFE4; } .box b { font-weight: 500; font-size: 32px; line-height: 1.25; }
  .photo .caption.illus { left: auto; right: 0; padding: 12px 80px 12px 20px; }
  .photo .caption { position: absolute; left: 0; bottom: 0; z-index: 3; padding: 12px 20px 12px 80px; background: rgba(15,23,41,.9); color: #E2E8F0; font-size: 26px; line-height: 1.2; letter-spacing: 0.02em; }
  .block.spread.tight > .list { margin-top: 40px; } .block.spread.tight > .list .item { padding: 22px 0; }
  /* Posts and carousels use the guide's four post grounds and their pairings (Colour, Combinations): brand blue with a

      for (let x = 0; x < W; x += 2) { const k = (y * W + x) * 4, key = ((d[k] >> 3) << 10) | ((d[k + 1] >> 3) << 5) | (d[k + 2] >> 3); counts.set(key, (counts.get(key) || 0) + 1); n++; }
      const top = [...counts].sort((a, b) => b[1] - a[1])[0][0], c = [(top >> 10) * 8 + 4, ((top >> 5) & 31) * 8 + 4, (top & 31) * 8 + 4];
      let near = 0;
      for (let x = 0; x < W; x += 2) { const k = (y * W + x) * 4; if (Math.max(Math.abs(d[k] - c[0]), Math.abs(d[k + 1] - c[1]), Math.abs(d[k + 2] - c[2])) <= 32) near++; }
      empty.push(near >= n * 0.985);
    }
    // Rows across a picture's subject are the picture, even where they are plain (a blank label, a sky): the cover rule judges them.
    cover.forEach((c) => { if (c.box) for (let y = c.box[1]; y < c.box[3]; y++) empty[y] = false; });
    const runs = []; let a = -1;
    for (let y = 0; y <= H; y++) { if (y < H && empty[y]) { if (a < 0) a = y; } else if (a >= 0) { runs.push([a, y]); a = -1; } }
    const inner = runs.filter(([y0, y1]) => y0 > 0 && y1 < H), edge = runs.filter(([y0, y1]) => y0 === 0 || y1 === H);
    const tall = (rs) => rs.reduce((m, r) => (r[1] - r[0] > m[1] - m[0] ? r : m), [0, 0]);
    return { cover, strip: tall(inner), edge: tall(edge), h: H };
  };
  // Layout checks run once fonts and images are in; render.mjs calls this after loading.
  window.audit = function (spec, shot) {
    const post = spec.kind === 'post' || spec.kind === 'carousel';
    const [w, h] = SIZES[spec.format];
    issues = built.filter((x) => shot === undefined || x.shot === shot);
    measure({ w, h, m: safe(spec.format, [w, h], post) }, post ? 26 : 32, shot);
    return issues;
  };

  window.frame = async function (n) {
    for (const s of shots) s.L.style.display = n >= s.at && n < s.at + s.len + (s.tail || 0) ? '' : 'none';
    for (const s of shots) if (s.L.style.display === '') s.L._patternFrame?.(n);
    for (const w of claimWindows) w.el.style.display = n >= w.from && n < w.to ? '' : 'none';
    // Later tweens on the same element win once they start.
    for (const a of anim) {
      if (a.fn) { a.fn(ease[a.curve](Math.min(1, Math.max(0, (n - a.start) / a.len)))); continue; }
      if (n < a.start && anim.some((b) => b.el === a.el && b !== a && b.start < a.start)) continue;
      const p = ease[a.curve](Math.min(1, Math.max(0, (n - a.start) / a.len)));
      const mix = (k) => a.from[k] === undefined ? undefined : a.from[k] + (a.to[k] - a.from[k]) * p;
      apply(a.el, { o: mix('o'), y: mix('y'), x: mix('x'), yp: mix('yp'), s: mix('s') });
    }
    const t = n / fps, cue = captions.find((q) => t >= q.from && t < q.to);
    const cap = document.querySelector('.captions');
    cap.innerHTML = cue ? cue.text.split('|').map((l) => `<span>${html(l)}</span>`).join('') : '';
    // While a lower third is on screen the captions sit above it, never over the name.
    const plate = shots.find((s) => s.L.style.display === '')?.L.querySelector('.plate');
    cap.style.bottom = plate && cue ? capBase + plate.offsetHeight + 24 + 'px' : capBase + 'px';
    if (grain) { grain.style.backgroundImage = `url(${grainTiles[n % 4]})`; grain.style.backgroundPosition = `${(n * 83) % 256}px ${(n * 137) % 256}px`; }
    // Every video in the visible shot is seeked to its exact frame.
    for (const s of shots) {
      if (s.L.style.display !== '') continue;
      for (const v of s.L.querySelectorAll('video[data-in]')) {
        const target = +v.dataset.in + (n - s.at) / fps;
        if (Math.abs(v.currentTime - target) > 1e-4) { v.currentTime = target; await new Promise((r) => v.addEventListener('seeked', r, { once: true })); }
      }
    }
  };
</script>
