name: Publish @aisgroup/design

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/design

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Configure npm for Artifact Registry
        # Written to ~/.npmrc: npm config set refuses to run inside a workspace (ENOWORKSPACES)
        run: |
          echo "@aisgroup:registry=https://europe-southwest1-npm.pkg.dev/rosepetal-artifact/open-node-packages/" >> ~/.npmrc
          echo "//europe-southwest1-npm.pkg.dev/rosepetal-artifact/open-node-packages/:_authToken=$(gcloud auth print-access-token)" >> ~/.npmrc

      - name: Check the package depends on nothing of an app
        run: |
          if grep -rnE '\$t\(|useI18n|vue-i18n|rosepetal-model|from .@/' ui blocks lib examples; then
            echo "::error::the package must not use translations, the model or an app's @/ imports"
            exit 1
          fi

      - name: Check what would be published
        run: |
          files=$(npm pack --dry-run --json --ignore-scripts) || { echo "::error::npm pack --dry-run failed"; exit 1; }
          if grep -q 'gha-creds-' <<< "$files"; then
            echo "::error::gha-creds-*.json (the GCP service-account key) would be published: exclude it"
            exit 1
          fi
          for path in styles.css ui/button/index.ts blocks/TopBar.vue blocks/LoginPage.vue blocks/LogTerminal.vue lib/utils.ts examples/dialog/01-form.vue; do
            grep -q "\"$path\"" <<< "$files" || { echo "::error::$path is missing from the package"; exit 1; }
          done

      - name: Publish
        run: npm publish
